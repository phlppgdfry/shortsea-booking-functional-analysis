<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"><rect width="1200" height="1000" fill="#F2F5F7"/><g font-family="Inter,Arial,sans-serif"><text x="40" y="46" font-size="25" font-weight="700" fill="#192D3C">Shortsea Booking · request to history</text><text x="40" y="76" font-size="14" fill="#526273">Fictional portfolio · 2026-10-17 · editable vector handover</text><g id="screen-1" transform="translate(40,110)"><rect width="540" height="390" rx="12" fill="white" stroke="#CBD5DD"/><path d="M12 0 H528 Q540 0 540 12 V56 H0 V12 Q0 0 12 0" fill="#176B65"/><text x="22" y="35" font-size="19" font-weight="600" fill="white">1 / Request a sailing change</text><text x="22" y="86" font-size="14" fill="#526273">US-01 / US-12 · portal or agent</text><text x="22" y="120" font-size="13" fill="#526273">Booking / revision</text><text x="225" y="120" font-size="14" font-weight="600" fill="#192D3C">B1 / 1</text><path d="M22 133 H518" stroke="#E7ECEF"/><text x="22" y="162" font-size="13" fill="#526273">Requested departure</text><text x="225" y="162" font-size="14" font-weight="600" fill="#192D3C">T-75 · NEW</text><path d="M22 175 H518" stroke="#E7ECEF"/><text x="22" y="204" font-size="13" fill="#526273">Policy at receipt</text><text x="225" y="204" font-size="14" font-weight="600" fill="#192D3C">v1 · 90-minute cut-off</text><path d="M22 217 H518" stroke="#E7ECEF"/><text x="22" y="246" font-size="13" fill="#526273">Terminal observation</text><text x="225" y="246" font-size="14" font-weight="600" fill="#192D3C">GATED_IN · fresh (0 min)</text><path d="M22 259 H518" stroke="#E7ECEF"/><rect x="22" y="305" width="496" height="38" rx="6" fill="#176B65"/><text x="38" y="330" font-size="14" fill="white">Submit request</text><text x="22" y="371" font-size="12" fill="#526273">Alternate: UNKNOWN / &gt;5 min stale → refuse; booking unchanged.</text></g><g id="screen-2" transform="translate(620,110)"><rect width="540" height="390" rx="12" fill="white" stroke="#CBD5DD"/><path d="M12 0 H528 Q540 0 540 12 V56 H0 V12 Q0 0 12 0" fill="#176B65"/><text x="22" y="35" font-size="19" font-weight="600" fill="white">2 / Terminal approval</text><text x="22" y="86" font-size="14" fill="#526273">US-04 / US-05 · duty planner</text><text x="22" y="120" font-size="13" fill="#526273">Amendment</text><text x="225" y="120" font-size="14" font-weight="600" fill="#192D3C">A · PENDING_APPROVAL</text><path d="M22 133 H518" stroke="#E7ECEF"/><text x="22" y="162" font-size="13" fill="#526273">Reservation</text><text x="225" y="162" font-size="14" font-weight="600" fill="#192D3C">One place held on NEW</text><path d="M22 175 H518" stroke="#E7ECEF"/><text x="22" y="204" font-size="13" fill="#526273">Operational closure</text><text x="225" y="204" font-size="14" font-weight="600" fill="#192D3C">T-30 · expiry wins</text><path d="M22 217 H518" stroke="#E7ECEF"/><text x="22" y="246" font-size="13" fill="#526273">Second customer</text><text x="225" y="246" font-size="14" font-weight="600" fill="#192D3C">NO_CAPACITY · no hold</text><path d="M22 259 H518" stroke="#E7ECEF"/><rect x="22" y="305" width="496" height="38" rx="6" fill="#176B65"/><text x="38" y="330" font-size="14" fill="white">Approve after current safety checks</text><text x="22" y="371" font-size="12" fill="#526273">Agent cannot approve. Expiry/supersession releases the hold once.</text></g><g id="screen-3" transform="translate(40,540)"><rect width="540" height="390" rx="12" fill="white" stroke="#CBD5DD"/><path d="M12 0 H528 Q540 0 540 12 V56 H0 V12 Q0 0 12 0" fill="#176B65"/><text x="22" y="35" font-size="19" font-weight="600" fill="white">3 / Decision and delivery</text><text x="22" y="86" font-size="14" fill="#526273">US-07 · BR-16 / BR-19–21</text><text x="22" y="120" font-size="13" fill="#526273">Amendment</text><text x="225" y="120" font-size="14" font-weight="600" fill="#192D3C">APPLIED · booking revision 2</text><path d="M22 133 H518" stroke="#E7ECEF"/><text x="22" y="162" font-size="13" fill="#526273">New sailing</text><text x="225" y="162" font-size="14" font-weight="600" fill="#192D3C">NEW</text><path d="M22 175 H518" stroke="#E7ECEF"/><text x="22" y="204" font-size="13" fill="#526273">Terminal delivery</text><text x="225" y="204" font-size="14" font-weight="600" fill="#192D3C">FAILED · 3 attempts</text><path d="M22 217 H518" stroke="#E7ECEF"/><text x="22" y="246" font-size="13" fill="#526273">Support action</text><text x="225" y="246" font-size="14" font-weight="600" fill="#192D3C">Replay latest &amp; verify</text><path d="M22 259 H518" stroke="#E7ECEF"/><rect x="22" y="305" width="496" height="38" rx="6" fill="#176B65"/><text x="38" y="330" font-size="14" fill="white">Open terminal reconciliation</text><text x="22" y="371" font-size="12" fill="#526273">Booking commit survives failed delivery; do not resubmit booking.</text></g><g id="screen-4" transform="translate(620,540)"><rect width="540" height="390" rx="12" fill="white" stroke="#CBD5DD"/><path d="M12 0 H528 Q540 0 540 12 V56 H0 V12 Q0 0 12 0" fill="#176B65"/><text x="22" y="35" font-size="19" font-weight="600" fill="white">4 / Booking history</text><text x="22" y="86" font-size="14" fill="#526273">US-10 / US-12 · support and agent</text><text x="22" y="120" font-size="13" fill="#526273">Receipt</text><text x="225" y="120" font-size="14" font-weight="600" fill="#192D3C">v1 retained after v2 launch</text><path d="M22 133 H518" stroke="#E7ECEF"/><text x="22" y="162" font-size="13" fill="#526273">Decision</text><text x="225" y="162" font-size="14" font-weight="600" fill="#192D3C">APPROVED_BY_TERMINAL</text><path d="M22 175 H518" stroke="#E7ECEF"/><text x="22" y="204" font-size="13" fill="#526273">Delivery read-back</text><text x="225" y="204" font-size="14" font-weight="600" fill="#192D3C">NEW · mismatch cleared</text><path d="M22 217 H518" stroke="#E7ECEF"/><text x="22" y="246" font-size="13" fill="#526273">Audit evidence</text><text x="225" y="246" font-size="14" font-weight="600" fill="#192D3C">Revision 2 · one commit</text><path d="M22 259 H518" stroke="#E7ECEF"/><rect x="22" y="305" width="496" height="38" rx="6" fill="#176B65"/><text x="38" y="330" font-size="14" fill="white">Explain decision using saved rule version</text><text x="22" y="371" font-size="12" fill="#526273">v2 new T-75 request auto-accepts; DG remains 24 h.</text></g><text x="40" y="988" font-size="13" fill="#526273">Read order: 1 → 2 → 3 → 4. Alternate states and traceability are specified in the accompanying handover.</text></g></svg>